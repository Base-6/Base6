<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chilton Bridge Battle</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
:root{
  --bg0:#090b1e;
  --bg1:#16113a;
  --bg2:#30125c;
  --ink:#f8fbff;
  --soft:#cbd7ff;
  --line:rgba(255,255,255,0.18);
  --panel:rgba(12,16,42,0.82);
  --panel2:rgba(255,255,255,0.08);
  --gold:#ffd166;
  --cyan:#45e6ff;
  --pink:#ff61d8;
  --green:#7dff9d;
  --orange:#ff955c;
  --violet:#a98bff;
  --danger:#ff758f;
  --good:#6dffb2;
}
*{box-sizing:border-box;font-style:normal;}
html,body{margin:0;min-height:100%;font-family:"Atkinson Hyperlegible",Arial,sans-serif;background:radial-gradient(circle at 10% 0%,#3347a8 0%,transparent 27%),radial-gradient(circle at 88% 8%,#9c2b92 0%,transparent 27%),linear-gradient(180deg,var(--bg1),var(--bg0));color:var(--ink);text-align:left;}
body{font-size:19px;line-height:1.4;overflow-x:hidden;}
button,input,select{font-family:"Atkinson Hyperlegible",Arial,sans-serif;font-size:1rem;}
button{position:relative;z-index:40;border:0;border-radius:18px;min-height:56px;padding:14px 18px;background:linear-gradient(135deg,var(--cyan),#5d79ff);color:#071125;font-weight:900;cursor:pointer;box-shadow:0 12px 30px rgba(69,230,255,0.24);text-align:center;touch-action:manipulation;}
button:hover,button:focus{outline:4px solid rgba(255,209,102,0.45);outline-offset:2px;}

button.gold{background:linear-gradient(135deg,var(--gold),var(--orange));color:#1b1205;}
button.ghost{background:transparent;color:var(--soft);border:2px solid rgba(255,255,255,0.22);box-shadow:none;}
button.danger{background:linear-gradient(135deg,#ff8fb1,#ff5d75);color:#22050a;}
button:disabled{opacity:0.6;cursor:not-allowed;}
input,select{width:100%;min-height:56px;border-radius:16px;border:2px solid rgba(255,255,255,0.22);padding:13px 14px;background:rgba(255,255,255,0.94);color:#101828;}
label{display:block;margin:12px 0 6px;font-weight:900;color:var(--ink);}
h1,h2,h3,p{margin-top:0;}
h1{font-size:clamp(2rem,5vw,4.8rem);line-height:0.96;letter-spacing:-0.03em;text-shadow:0 6px 24px rgba(255,97,216,0.22);}
h2{font-size:clamp(1.45rem,3vw,2.5rem);line-height:1.04;}
h3{font-size:1.15rem;}
a{color:inherit;}
main{width:min(1380px,100vw);margin:0 auto;padding:14px;}
.hidden{display:none !important;}
.screen{min-height:calc(100vh - 28px);display:grid;gap:14px;}
.panel{position:relative;z-index:25;background:var(--panel);border:1px solid var(--line);border-radius:28px;box-shadow:0 24px 80px rgba(0,0,0,0.36);backdrop-filter:blur(16px);}
.hero{position:relative;overflow:hidden;min-height:calc(100vh - 28px);display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch;padding:18px;}
.hero:before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 70% 22%,rgba(255,209,102,0.22),transparent 20%),radial-gradient(circle at 26% 74%,rgba(69,230,255,0.20),transparent 24%);pointer-events:none;}
.heroCopy{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;padding:clamp(16px,4vw,44px);}
.kicker{display:inline-flex;width:max-content;align-items:center;gap:8px;border-radius:999px;padding:8px 12px;background:rgba(255,209,102,0.12);border:1px solid rgba(255,209,102,0.4);color:var(--gold);font-weight:900;letter-spacing:0.08em;text-transform:uppercase;font-size:0.78rem;margin-bottom:14px;}
.lead{font-size:clamp(1.1rem,2vw,1.35rem);color:var(--soft);max-width:62ch;}
.buttonRow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px;}
.animePoster{position:relative;z-index:2;min-height:560px;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,rgba(69,230,255,0.14),rgba(255,97,216,0.10)),radial-gradient(circle at 50% 30%,rgba(255,255,255,0.2),transparent 28%);border:1px solid var(--line);}
.posterCanvas,.sceneCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:1;}
.posterFallback{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 34%,rgba(69,230,255,0.18),transparent 26%);z-index:1;}
.fallbackHero{width:220px;height:310px;border-radius:120px 120px 70px 70px;background:linear-gradient(180deg,#ffdfc4 0 28%,#243b8f 28% 62%,#12172f 62%);border:8px solid rgba(255,255,255,0.2);position:relative;box-shadow:0 30px 80px rgba(0,0,0,0.45);}
.fallbackHero:before,.fallbackHero:after{content:"";position:absolute;top:78px;width:20px;height:20px;border-radius:50%;background:#071125;}
.fallbackHero:before{left:70px;}.fallbackHero:after{right:70px;}
.cardGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
.cardGrid.two{grid-template-columns:repeat(2,minmax(0,1fr));}
.cardGrid.three{grid-template-columns:repeat(3,minmax(0,1fr));}
.setupWrap{display:grid;grid-template-columns:0.8fr 1.2fr;gap:14px;align-items:stretch;}
.builderPreview{min-height:520px;overflow:hidden;padding:18px;display:grid;align-content:space-between;}
.formPanel{padding:22px;}
.characterStage{height:360px;border-radius:24px;background:radial-gradient(circle at 50% 20%,rgba(255,255,255,0.14),transparent 30%),linear-gradient(180deg,#262b6e,#11162f);border:1px solid var(--line);position:relative;overflow:hidden;}
.characterAvatar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:160px;height:270px;}

.avatarHair{position:absolute;left:28px;top:0;width:106px;height:74px;border-radius:60px 60px 28px 28px;background:#1e1e2a;}
.avatarHair.spikes{clip-path:polygon(0 100%,10% 18%,22% 72%,34% 0,48% 70%,62% 10%,78% 76%,92% 18%,100% 100%);}

 .heroCardName{position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;gap:8px;align-items:center;z-index:3;font-weight:900;color:var(--ink);}

.characterStage:after{content:"";position:absolute;inset:auto 12% 0;height:42%;background:radial-gradient(ellipse at center,rgba(69,230,255,0.2),transparent 70%);pointer-events:none;}
.avatarAcc{position:absolute;z-index:5;}
.avatarAcc.scarf{left:20px;top:116px;width:122px;height:20px;border-radius:999px;background:rgba(255,209,102,0.95);box-shadow:0 0 18px rgba(255,209,102,0.38);}
.avatarAcc.scarf:after{content:"";position:absolute;right:-12px;top:10px;width:38px;height:16px;border-radius:12px;background:rgba(255,209,102,0.95);transform:rotate(18deg);}
.avatarAcc.pin{left:102px;top:140px;width:28px;height:28px;background:var(--gold);clip-path:polygon(50% 0,61% 36%,100% 36%,68% 58%,80% 100%,50% 74%,20% 100%,32% 58%,0 36%,39% 36%);box-shadow:0 0 18px rgba(255,209,102,0.5);}
.avatarAcc.headset{left:33px;top:44px;width:94px;height:70px;border:7px solid var(--pink);border-bottom:0;border-radius:58px 58px 0 0;box-shadow:0 0 18px rgba(255,97,216,0.35);}
.avatarAcc.headset:before,.avatarAcc.headset:after{content:"";position:absolute;top:40px;width:18px;height:32px;border-radius:10px;background:var(--pink);}
.avatarAcc.headset:before{left:-14px}.avatarAcc.headset:after{right:-14px}
.avatarAcc.cape{left:21px;top:119px;width:120px;height:135px;background:linear-gradient(180deg,var(--pink),#4d2b9d);clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);border-radius:18px 18px 48px 48px;z-index:0;box-shadow:0 24px 46px rgba(255,97,216,0.25);}
.avatarAcc.cape:after{content:"";position:absolute;left:40px;right:40px;top:0;height:135px;background:rgba(255,255,255,0.12);}
.avatarHair.spikes:after{content:"";position:absolute;left:44px;top:-12px;width:22px;height:34px;background:inherit;clip-path:polygon(50% 0,100% 100%,0 100%);}
.avatarHair.wave:after{content:"";position:absolute;left:-6px;top:25px;width:48px;height:36px;border-radius:0 0 34px 34px;background:inherit;transform:rotate(14deg);}
.avatarHair.short:after{content:"";position:absolute;left:18px;right:18px;bottom:-8px;height:14px;border-radius:0 0 20px 20px;background:inherit;}
.setupHint{margin-top:12px;color:var(--gold);font-weight:900;min-height:1.2em;}
.setupHint.dim{color:var(--soft);}
.buddySpotlight{display:grid;gap:8px;place-items:center;text-align:center;padding:8px;}
.buddySpotlight h3{margin:0;font-size:1.35rem;}
.buddySpotlight p{margin:0;color:var(--soft);}
.buddyMiniRow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px;}
.buddyMini{min-height:50px;padding:8px 6px;border-radius:16px;font-size:0.9rem;}

.pickerRow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px;}
.pick{min-height:48px;padding:8px;border-radius:14px;}
.pick.selected{outline:4px solid rgba(255,209,102,0.52);}
.swatch{height:48px;border-radius:16px;border:3px solid rgba(255,255,255,0.82);box-shadow:none;padding:0;min-height:48px;}
.buddyCard{position:relative;overflow:hidden;min-height:280px;padding:16px;background:linear-gradient(180deg,rgba(255,255,255,0.12),rgba(255,255,255,0.05));border:1px solid rgba(255,255,255,0.18);border-radius:26px;cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;z-index:30;}
.buddyCard:hover,.buddyCard:focus{transform:translateY(-3px);border-color:rgba(255,209,102,0.8);box-shadow:0 20px 60px rgba(0,0,0,0.34);outline:none;}
.buddyCard.selected{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,209,102,0.24),0 22px 70px rgba(0,0,0,0.38);}
.buddySprite{height:155px;border-radius:22px;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,0.25),transparent 42%);}
.creature{position:relative;width:128px;height:128px;filter:drop-shadow(0 22px 18px rgba(0,0,0,0.34));transform-origin:50% 82%;animation:bobCreature 3.2s ease-in-out infinite;}
@keyframes bobCreature{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}
.creature span{position:absolute;display:none;}
.creature .body,.creature .head,.creature .eye,.creature .mouth,.creature .foot,.creature .cheek,.creature .belly,.creature .nose{display:block;}
.creature .eye{width:11px;height:15px;border-radius:50%;background:#061427;z-index:8;box-shadow:inset 0 4px rgba(255,255,255,0.42);}
.creature .mouth{z-index:9;border-radius:0 0 999px 999px;border-bottom:4px solid #061427;}
.creature .cheek{z-index:7;width:13px;height:9px;border-radius:50%;background:rgba(255,117,143,0.72);}
.creature .belly{z-index:4;background:rgba(255,255,255,0.52);}
.creature .foot{z-index:2;background:rgba(6,20,39,0.22);}
.creature .nose{z-index:9;background:#061427;}

.creature.add .eye.one{left:55px;top:35px}.creature.add .eye.two{left:80px;top:33px;height:20px;transform:rotate(8deg)}
.creature.add .nose{left:74px;top:51px;width:14px;height:10px;border-radius:50%;}
.creature.add .mouth{left:67px;top:57px;width:23px;height:12px;transform:rotate(-4deg)}
.creature.add .cheek.l{left:48px;top:52px}.creature.add .cheek.r{right:23px;top:50px}
.creature.add .belly{left:48px;top:68px;width:40px;height:31px;border-radius:50%;}
.creature.add .tail{display:block;right:0;bottom:31px;width:54px;height:36px;background:var(--gold);clip-path:polygon(0 46%,55% 46%,55% 18%,100% 50%,55% 82%,55% 56%,0 56%);z-index:0;animation:tailWag .85s ease-in-out infinite;transform-origin:0 50%;}
@keyframes tailWag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(16deg)}}
.creature.add .foot.l{left:41px;top:97px;width:23px;height:14px;border-radius:50%}.creature.add .foot.r{left:77px;top:96px;width:25px;height:15px;border-radius:50%}
.creature.add:after{content:"+";position:absolute;left:57px;top:71px;font-size:30px;color:#061427;font-weight:900;z-index:8;transform:rotate(-8deg)}
.creature.subtract .body{display:block;left:29px;top:54px;width:76px;height:56px;border-radius:38px 38px 30px 30px;background:linear-gradient(180deg,#bda9ff,#795cf5);box-shadow:inset 0 -14px rgba(0,0,0,0.16);}
.creature.subtract .head{display:block;left:33px;top:20px;width:66px;height:58px;border-radius:46px 46px 34px 34px;background:linear-gradient(180deg,#cabdff,#a98bff);}

.creature.subtract .ear.l{left:30px;transform:rotate(-22deg)}.creature.subtract .ear.r{right:28px;transform:rotate(22deg)}
.creature.subtract .eye.one{left:52px;top:42px;width:14px;height:6px;border-radius:999px;transform:rotate(10deg)}.creature.subtract .eye.two{left:78px;top:42px;width:14px;height:6px;border-radius:999px;transform:rotate(-10deg)}
.creature.subtract .brow{display:block;z-index:10;background:#061427;width:20px;height:5px;border-radius:999px;top:34px;}
.creature.subtract .brow.l{left:47px;transform:rotate(18deg)}.creature.subtract .brow.r{left:77px;transform:rotate(-18deg)}
.creature.subtract .nose{left:65px;top:52px;width:12px;height:9px;border-radius:50%;}
.creature.subtract .mouth{left:58px;top:59px;width:26px;height:12px;transform:rotate(180deg);border-bottom:0;border-top:4px solid #061427;border-radius:999px 999px 0 0;}
.creature.subtract .cloak{display:block;left:13px;top:57px;width:101px;height:64px;background:linear-gradient(180deg,#2f1a62,#090b1e);border-radius:14px 14px 58px 58px;z-index:0;}
.creature.subtract .belly{left:51px;top:72px;width:34px;height:25px;border-radius:50%;}
.creature.subtract .foot.l{left:39px;top:102px;width:23px;height:13px;border-radius:50%}.creature.subtract .foot.r{left:76px;top:102px;width:23px;height:13px;border-radius:50%}
.creature.subtract:after{content:"";position:absolute;left:47px;top:82px;width:42px;height:10px;border-radius:999px;background:#fff;z-index:7;box-shadow:0 0 14px rgba(255,255,255,0.55);}

.creature.multiply .eye.one{left:56px;top:36px}.creature.multiply .eye.two{left:82px;top:34px;width:15px;height:19px;}

.creature.divide:after{content:"÷";position:absolute;left:59px;top:73px;font-size:31px;color:#061427;font-weight:900;z-index:8;}

function setupWorldLabels(entities){

function updateWorldLabels(camera,entities){
  const layer=document.getElementById("worldLabels");
  if(!layer||!window.THREE)return;
  const near=nearestEntity();
  const now=Date.now();
  const w=layer.clientWidth||1,h=layer.clientHeight||1;
  entities.forEach(({mesh,data:e})=>{
    const el=document.getElementById("label_"+e.id);
    if(!el)return;
    const p=new window.THREE.Vector3(mesh.position.x,mesh.position.y+1.65,mesh.position.z);
    p.project(camera);
    const x=(p.x*.5+.5)*w;
    const y=(-p.y*.5+.5)*h;
    const on=p.z>-1&&p.z<1&&x>-80&&x<w+80&&y>-80&&y<h+80;
    el.style.left=x+"px";el.style.top=y+"px";el.style.display=on?"block":"none";
    el.classList.toggle("awake",!!near&&near.id===e.id);
    const speaking=state.bridge&&state.bridge.speechId===e.id&&state.bridge.speechUntil>now;
    el.classList.toggle("speaking",speaking);
    const speech=document.getElementById("speech_"+e.id);
    if(speech&&speaking)speech.textContent=state.bridge.speechLine||e.line||"Hello from the bridge.";
  });
  if(state.bridge&&state.bridge.speechUntil&&state.bridge.speechUntil<=now){
    state.bridge.speechId="";

  }
}

function animateBridge(renderer,scene,camera,hero,bud,entities){
  let raf;let last=0;let saveClock=0;const maxSpeed=3.05;let overlayClock=0;
  function loop(ms){
    const t=ms/1000;const dt=Math.min(0.05,last?((ms-last)/1000):0.016);last=ms;
    ensureBridgeState();
    let ix=0,iz=0;
    if(!state.paused){
      if(inputKeys.ArrowLeft||inputKeys.KeyA)ix-=1;if(inputKeys.ArrowRight||inputKeys.KeyD)ix+=1;if(inputKeys.ArrowUp||inputKeys.KeyW)iz-=1;if(inputKeys.ArrowDown||inputKeys.KeyS)iz+=1;
      if(activeTouchMove){ix+=activeTouchMove.x;iz+=activeTouchMove.z;}
    }
    if(ix||iz){state.bridge.target=null;const len=Math.hypot(ix,iz)||1;state.bridge.x+=ix/len*maxSpeed*dt;state.bridge.z+=iz/len*maxSpeed*dt;}
    else if(state.bridge.target){const tx=state.bridge.target.x-state.bridge.x,tz=state.bridge.target.z-state.bridge.z;const dist=Math.hypot(tx,tz);if(dist<0.05)state.bridge.target=null;else{state.bridge.x+=tx/dist*Math.min(dist,maxSpeed*dt);state.bridge.z+=tz/dist*Math.min(dist,maxSpeed*dt);}}
    state.bridge.x=Math.max(-BRIDGE_X_LIMIT,Math.min(BRIDGE_X_LIMIT,state.bridge.x));state.bridge.z=Math.max(BRIDGE_Z_MIN,Math.min(BRIDGE_Z_MAX,state.bridge.z));
    hero.position.x+=(state.bridge.x-hero.position.x)*0.22;hero.position.z+=(state.bridge.z-hero.position.z)*0.22;
    bud.position.x+=(state.bridge.x+0.55-bud.position.x)*0.16;bud.position.z+=(state.bridge.z+0.18-bud.position.z)*0.16;
    hero.position.y=0.08+Math.sin(t*5)*0.022;bud.position.y=0.08+Math.sin(t*4.5+1)*0.05;
    const moving=ix||iz||state.bridge.target;hero.rotation.y+=(moving?Math.sin(t*8)*0.035:0-hero.rotation.y)*0.08;
    entities.forEach((e,i)=>{e.mesh.position.y=0.12+Math.sin(t*2+i)*0.035;e.mesh.rotation.y=Math.sin(t*1.2+i)*0.14;if(e.ring){e.ring.scale.setScalar(1+Math.sin(t*2.6+i)*0.04);}});

}

function addCone(g,x,y,rot,c){const cone=new THREE.Mesh(new THREE.ConeGeometry(0.14,0.42,4),mat(c));cone.position.set(x,y,0);cone.rotation.z=rot;g.add(cone);}
const inputKeys={};let activeTouchMove=null;
function dirVector(name){return name==="up"?{x:0,z:-1}:name==="down"?{x:0,z:1}:name==="left"?{x:-1,z:0}:{x:1,z:0};}
app.addEventListener("pointerdown",function(e){
  const d=e.target.closest("button[data-dir]");
  if(d){e.preventDefault();if(!state.paused)activeTouchMove=dirVector(d.dataset.dir);return;}
});
window.addEventListener("pointerup",function(){activeTouchMove=null;});
window.addEventListener("pointercancel",function(){activeTouchMove=null;});
app.addEventListener("click",function(e){const t=e.target.closest("button,[data-buddy],[data-answer]");if(!t)return;e.preventDefault();if(t.dataset.dir)return;if(t.dataset.buddy){state.buddyType=t.dataset.buddy;saveNow();render();return;}if(t.dataset.answer){submitAnswer(t.dataset.answer);return;}if(t.dataset.move){chooseMove(t.dataset.move);return;}if(t.dataset.pick){state.character[t.dataset.pick]=t.dataset.value;saveNow();render();return;}if(t.dataset.initials){buildReport(t.dataset.initials);return;}const a=t.dataset.act;if(!a)return;if(a==="continue"){const s=loadSave();if(s){state=s;if(!state.screen)state.screen="bridge";render();}}else if(a==="modeArc"||a==="modeFull"){setPlayMode(a==="modeFull"?"full":"arc");saveNow();render();}else if(a==="new"){setPlayMode("arc");saveNow();render();}else if(a==="surpriseHero"){surpriseHero();saveNow();render();}else if(a==="buddy"){const input=document.getElementById("heroName");state.character.name=(input&&input.value.trim()?input.value.trim():"Bridge Hero").slice(0,18);state.setup="buddy";state.screen="setup";saveNow();render();}else if(a==="character"){state.setup="hero";saveNow();render();}else if(a==="bridge"){if(!state.buddyType){state.message="Pick a buddy that feels good first.";render();return;}state.knownMoves=[state.buddyType];state.clearedFoes=[];state.foeIndex=0;state.buddyStage=1;state.xp=0;state.focus=0;state.lastEvolution=null;state.pendingEvolution=null;state.rivalCards=[];state.lastCard=null;bridgeEntityCacheKey="";nearestCache=null;state.screen="bridge";state.paused=false;ensureBridgeState();state.bridge.x=0;state.bridge.z=1.9;state.bridge.talk=state.playMode==="full"?"Full route loaded. Clear each area to travel onward.":"One area loaded. Defeat every rival here, then take a breather.";state.message=state.bridge.talk;saveNow();render();}else if(a==="startBattle"){startBattle(false);}else if(a==="startStephen"){startBattle(true);}else if(a.startsWith("spar:")){const idx=parseInt(a.split(":")[1],10);startBattle(false,idx);}else if(a.startsWith("talk:")){talkToEntity(a.split(":")[1]);}else if(a==="guide"){const g=document.getElementById("guide");if(g)g.classList.toggle("hidden");}else if(a==="carryOn"){if(state.playMode==="arc"&&state.foeIndex>=(state.arcGoal||AREA_SIZE)&&state.foeIndex<50)state.arcGoal=Math.min(50,(state.arcGoal||AREA_SIZE)+AREA_SIZE);state.screen="bridge";state.arcClear=null;state.partialReportText="";ensureBridgeState();state.bridge.x=0;state.bridge.z=1.9;state.bridge.target=null;state.bridge.talk=state.foeIndex<50?"Arrived at "+checkpointName()+". Clear every rival here to travel onward.":"Route clear. Stephen is ready.";state.message=state.bridge.talk;bridgeEntityCacheKey="";nearestCache=null;saveNow();render();}else if(a==="evoContinue"){const next=state.pendingEvolution&&state.pendingEvolution.nextScreen?state.pendingEvolution.nextScreen:"bridge";state.pendingEvolution=null;state.screen=next;saveNow();render();}else if(a==="meetStephen"){state.screen="bridge";state.arcClear=null;ensureBridgeState();state.bridge.x=0;state.bridge.z=-3.05;state.bridge.talk="Stephen is just ahead. Final spar when it feels right.";saveNow();render();}else if(a==="cards"){state.screen="cards";saveNow();render();}else if(a==="partialReport"){state.partialReportText=buildProgressReport();state.screen="partialReport";saveNow();render();}else if(a==="backFromPartial"){state.screen=state.arcClear?"arcClear":"bridge";render();}else if(a==="save"){saveNow();state.message="Saved on this device.";if(state.bridge)state.bridge.talk=state.message;const dock=document.getElementById("quickDock");if(dock)updateBridgeOverlay(true);}else if(a==="pause"){if(state.screen==="battle"&&state.battle){state.battle.paused=true;}else{state.paused=true;}saveNow();render();}else if(a==="resumeBattle"){if(state.battle)state.battle.paused=false;state.paused=false;activeTouchMove=null;saveNow();render();}else if(a==="sendProgress"){openProgressEmail();render();}else if(a==="resetGame"){resetWholeGame();}else if(a==="resetBattle"){if(state.battle){const wasStephen=!!state.battle.isStephen;const idx=state.battle.foeIndex;startBattle(wasStephen,idx);if(state.battle){state.battle.message="Reset. Fresh spar loaded.";state.battle.paused=false;saveNow();render();}}}else if(a==="pauseBridge"){state.screen="bridge";state.battle=null;state.paused=false;ensureBridgeState();state.bridge.talk="Paused at the bridge. No progress lost.";state.message=state.bridge.talk;saveNow();render();}else if(a==="glowToggle"){if(state.battle&&glowReady()){state.battle.useGlow=!state.battle.useGlow;saveNow();render();}}else if(a==="buddyNudge"){if(state.battle&&state.battle.phase==="question"&&!state.battle.assistActive){state.battle.assistUsed=true;state.battle.assistActive=true;saveNow();render();}}else if(a==="battleNext"){advanceBattle();}else if(a==="backMove"){state.battle.phase="choose";state.battle.chosenMove="";state.battle.question=null;state.battle.options=[];state.battle.fxType="";state.battle.fxText="";state.battle.fxMove="";state.battle.assistActive=false;state.battle.assistUsed=false;saveNow();render();}else if(a==="submit"){const inp=document.getElementById("answerInput");submitAnswer(inp?inp.value:"");}else if(a==="toBridge"){state.screen="bridge";state.paused=false;render();}});
app.addEventListener("input",function(e){if(e.target&&e.target.id==="heroName"){state.character.name=e.target.value.slice(0,18);const n=document.getElementById("heroCardName");if(n)n.textContent=heroDisplayName();scheduleSave();}});
function movementKey(e,down){
  const target=e.target;
  if(target&&(target.tagName==="INPUT"||target.tagName==="TEXTAREA"||target.tagName==="SELECT")){if(e.key==="Enter"&&target.id==="answerInput")submitAnswer(target.value);return;}
  if(down&&e.code==="Escape"&&(state.screen==="bridge"||state.screen==="battle")){if(state.screen==="battle"&&state.battle)state.battle.paused=!state.battle.paused;else state.paused=!state.paused;saveNow();render();e.preventDefault();return;}
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","KeyW","KeyA","KeyS","KeyD"].includes(e.code)){inputKeys[e.code]=down;e.preventDefault();}
  if(down&&state.screen==="bridge"&&!state.paused&&e.code==="KeyE"){interactNear("chat");e.preventDefault();}
  if(down&&state.screen==="bridge"&&!state.paused&&(e.code==="Space"||e.code==="Enter")){interactNear("spar");e.preventDefault();}
}
window.addEventListener("keydown",function(e){movementKey(e,true);});
window.addEventListener("keyup",function(e){movementKey(e,false);});
window.addEventListener("beforeunload",saveNow);
cleanJayNamesInStorage();
state=normaliseState(loadSave()||freshState());render();
})();
